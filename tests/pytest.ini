[pytest]
# Pytest configuration for scraper unit tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    unit: unit test (no network, uses mocks)
    integration: integration test (may need network)
    slow: slow test (skip during rapid iteration)
    asyncio: async test

# Test paths
testpaths = .

# Minimum Python version
minversion = 3.8
